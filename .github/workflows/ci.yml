name: CI

on:
  push:
    branches:
      - main
      - "m0/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-contracts:
    name: Core contracts and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check platform boundary
        run: bash scripts/check-architecture.sh

      - name: Run core tests
        run: ./gradlew --no-daemon --console=plain :capture-api:check :processing-api:check --stacktrace

  android-build:
    name: Android debug and release build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug and unsigned release APKs
        run: ./gradlew --no-daemon --console=plain :app-android:assembleDebug :app-android:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: open-smartphone-camera-ex-debug
          path: app-android/build/outputs/apk/debug/app-android-debug.apk
          if-no-files-found: error

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run lint
        run: ./gradlew --no-daemon --console=plain :app-android:lintDebug :platform:android:lintDebug --stacktrace

  android-unit:
    name: Android unit-test tasks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Android unit-test tasks
        run: ./gradlew --no-daemon --console=plain :app-android:testDebugUnitTest :platform:android:testDebugUnitTest --stacktrace
